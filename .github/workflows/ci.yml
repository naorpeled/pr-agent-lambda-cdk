name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # cdk synth needs no Docker and no AWS calls here, because the image is
      # referenced from ECR rather than built. A fake account and a stand-in
      # tag keep it offline; a real deploy reads the tag `make image` recorded.
      - name: Synth
        run: npx cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          AWS_REGION: us-east-1
          IMAGE_TAG: 0.0.0-ci-github_lambda

      - name: Synth arm64 variant
        run: npx cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          AWS_REGION: us-east-1
          IMAGE_TAG: 0.0.0-ci-github_lambda
          ARCH: arm64

      - name: Synth GitHub with async reviews
        run: npx cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          AWS_REGION: us-east-1
          IMAGE_TAG: 0.0.0-ci-github_lambda
          ASYNC_REVIEWS: 'true'

      # Non-GitHub providers refuse images older than 0.46.0, so the stand-in
      # tags have to be new enough. They're async by default.
      - name: Synth every other provider
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          AWS_REGION: us-east-1
        run: |
          IMAGE_TAG=99.0.0-ci-gitlab_lambda PROVIDER_URL=https://gitlab.example.com npx cdk synth > /dev/null
          IMAGE_TAG=99.0.0-ci-gitea_lambda npx cdk synth > /dev/null
          IMAGE_TAG=99.0.0-ci-bitbucket_server_lambda PROVIDER_URL=https://bitbucket.example.com npx cdk synth > /dev/null
          IMAGE_TAG=99.0.0-ci-azure_devops_lambda PROVIDER_URL=https://dev.azure.com/example npx cdk synth > /dev/null

      - name: Build the provider wrapper image
        run: |
          docker buildx build --provenance=false --load \
            --build-arg BASE_IMAGE=pragent/pr-agent:github_lambda \
            --build-arg PR_AGENT_SERVER=gitea \
            --tag provider-wrapper-check lambda/provider

      - name: Shellcheck
        run: shellcheck -e SC1091 scripts/*.sh
